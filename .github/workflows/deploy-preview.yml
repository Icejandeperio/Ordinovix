# Ordinovix preview deploy (human-owned; see docs/adr/ADR-0002).
# Runs after `verify` passes on a push to main, or by manual dispatch from main (optionally reseeding the Demo
# organization). Inert until the owner's setup script has added the Cloudflare secrets and database ids.
name: deploy-preview

on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reseed:
        description: Replace the preview Demo organization with fresh sample data
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-preview
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run can carry a fork's branch named "main": require a push event from this repository.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'
    steps:
      - name: Check out the commit that passed verify
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check that Cloudflare is set up
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ ! -f wrangler.jsonc ]; then
            echo "::notice::Preview deploy skipped: Cloudflare secrets or wrangler.jsonc not present yet (owner setup, ADR-0002)."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if node -e '
            const fs = require("fs");
            const txt = fs.readFileSync("wrangler.jsonc", "utf8")
              .replace(/\/\*[\s\S]*?\*\//g, "").replace(/^\s*\/\/.*$/gm, "").replace(/,\s*([}\]])/g, "$1");
            const env = (JSON.parse(txt).env || {})[process.argv[1]] || {};
            const ids = (env.d1_databases || []).map((d) => d.database_id || "");
            process.exit(ids.length && ids.every((id) => id && !/^0{8}-/.test(id)) ? 0 : 1);
          ' preview; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Preview deploy skipped: the preview D1 database id in wrangler.jsonc is still a placeholder."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.ready.outputs.ok == 'true'
        run: npm ci

      - name: Apply database migrations (preview)
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply DB --remote --env preview

      - name: Reseed the Demo organization
        if: steps.ready.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.reseed
        run: |
          npm run --silent db:seed-sql > "$RUNNER_TEMP/seed.sql"
          npx wrangler d1 execute DB --remote --env preview --file "$RUNNER_TEMP/seed.sql"

      - name: Build for preview
        if: steps.ready.outputs.ok == 'true'
        run: npm run build
        env:
          CLOUDFLARE_ENV: preview
          VITE_DATA_SOURCE: api

      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Health check
        if: steps.ready.outputs.ok == 'true'
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          test -n "$url" || { echo "::error::No workers.dev URL in the deploy output"; exit 1; }
          echo "Preview: $url"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url/api/v1/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::$url/api/v1/health did not answer"; exit 1

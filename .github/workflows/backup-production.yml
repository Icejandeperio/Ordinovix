# Ordinovix weekly production backup (human-owned; see docs/adr/ADR-0002 and BACKEND_PLAN section 9).
# Exports the production D1 database into the private R2 bucket. Never upload an export as a GitHub artifact:
# this repository is public. Inert until the owner's setup script has run.
name: backup-production

on:
  schedule:
    - cron: '7 18 * * 0' # Sunday 18:07 UTC = Monday 02:07 Asia/Manila
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Check that Cloudflare is set up
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ ! -f wrangler.jsonc ]; then
            echo "::notice::Backup skipped: Cloudflare is not set up yet."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.ready.outputs.ok == 'true'
        run: npm ci

      - name: Export and store
        if: steps.ready.outputs.ok == 'true'
        run: |
          day=$(date -u +%F)
          npx wrangler d1 export DB --remote --env production --output "$RUNNER_TEMP/db.sql"
          npx wrangler r2 object put "ordinovix-files/backups/db/$day.sql" --file "$RUNNER_TEMP/db.sql" --remote
          rm -f "$RUNNER_TEMP/db.sql"

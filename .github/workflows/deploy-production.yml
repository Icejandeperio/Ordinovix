# Ordinovix production deploy (human-owned; see docs/adr/ADR-0002).
# Manual only: dispatch from main, type DEPLOY, then approve as the required reviewer of the `production`
# environment. Refuses a commit whose `verify` run did not pass.
name: deploy-production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to release the current main to production
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Require a passing verify run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow verify.yml --commit "$GITHUB_SHA" \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          test "$result" -ge 1 || { echo "::error::verify has not passed for $GITHUB_SHA"; exit 1; }

      - name: Require Cloudflare setup
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -f wrangler.jsonc \
            || { echo "::error::Cloudflare secrets or wrangler.jsonc missing (owner setup, ADR-0002)"; exit 1; }
          node -e '
            const fs = require("fs");
            const txt = fs.readFileSync("wrangler.jsonc", "utf8")
              .replace(/\/\*[\s\S]*?\*\//g, "").replace(/^\s*\/\/.*$/gm, "").replace(/,\s*([}\]])/g, "$1");
            const env = (JSON.parse(txt).env || {})[process.argv[1]] || {};
            const ids = (env.d1_databases || []).map((d) => d.database_id || "");
            if (!(ids.length && ids.every((id) => id && !/^0{8}-/.test(id)))) {
              console.error("::error::the production D1 database id in wrangler.jsonc is still a placeholder"); process.exit(1);
            }
          ' production

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply database migrations (production)
        run: npx wrangler d1 migrations apply DB --remote --env production

      - name: Build for production
        run: npm run build
        env:
          CLOUDFLARE_ENV: production
          VITE_DATA_SOURCE: api

      - name: Deploy
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Health check
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          test -n "$url" || { echo "::error::No workers.dev URL in the deploy output"; exit 1; }
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url/api/v1/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::$url/api/v1/health did not answer"; exit 1

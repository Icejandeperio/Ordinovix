<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%235A3DB8'><rect x='1.5' y='1.5' width='29' height='29' rx='6' stroke-width='2'/><rect x='5' y='5' width='22' height='22' rx='3.5' stroke-width='1'/><circle cx='16' cy='16' r='6' stroke-width='3.2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#EEF1F4" id="theme-color-meta" />
    <meta name="description" content="Ordinovix — Private practice workflow system for trusted Philippine tax preparers" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <title>Ordinovix</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ox-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved || saved === 'system') && systemDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#0E131C');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

gates:
  T0:
    - name: static_check
      command: npm.cmd run lint
  T1:
    - name: fast_test
      command: npm.cmd run test:run
    - name: type_check
      command: npx.cmd tsc --noEmit
  T2:
    - name: unit_tests
      command: npm.cmd run test:run
    - name: type_check
      command: npx.cmd tsc --noEmit
    - name: build_check
      command: npm.cmd run build
  T3:
    - name: full_verification
      command: npm.cmd run test:run
    - name: boundary_tests
      command: npx.cmd vitest run src/domain/rules.test.ts src/domain/metrics.test.ts
    - name: build_check
      command: npm.cmd run build

default: T1
paths:
  T0: ["docs/**/*.md", "README.md", "PREVIEW.md", "**/*.css"]
  T1: ["src/components/**", "src/routes/**", "src/hooks/**", "src/lib/**"]
  T2: ["package.json", "package-lock.json", "src/domain/**", "src/data/**", "policy/dependencies.yaml"]
  T3: ["src/domain/rules.ts", "policy/**", ".agents/**", "scripts/**", "AGENTS.md"]
escalations:
  - pattern: "service_role|SECURITY DEFINER|dangerouslySetInnerHTML|child_process|eval\\("
    tier: T3
  - pattern: "https?://[a-z0-9.-]+"
    tier: T2
tests:
  modify_or_delete_acceptance_or_security: T3
  add_acceptance_by_verifier: inherit
